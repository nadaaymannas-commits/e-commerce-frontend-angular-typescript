<div class="container mt-5 mb-5">
  <h2 class="mb-4 text-uppercase fw-bold">Shopping Cart</h2>

  @if (cartItems.length === 0) {
    <div class="text-center py-5">
      <h4 class="text-muted">Your cart is empty</h4>
      <a routerLink="/product-list" class="btn btn-dark mt-3">Continue Shopping</a>
    </div>
  } @else {
    <div class="row">
      <div class="col-md-8">
        @for (item of cartItems; track item.product._id) {
          <div class="card mb-3 shadow-sm border-0">
            <div class="row g-0 align-items-center">
              <div class="col-md-3">
<img [src]="staticURL + item.product.imgURL" class="img-fluid rounded-start" style="height: 120px; object-fit: cover; width: 100%;" alt="...">              </div>
              <div class="col-md-9">
                <div class="card-body d-flex justify-content-between align-items-center">
                  <div>
                    <h5 class="card-title fw-bold">{{ item.product.name }}</h5>
                    <p class="card-text text-muted mb-1">Price: {{ item.product.price }} EGP</p>
                  </div>
                  <div class="d-flex align-items-center gap-3">
                    <input type="number" class="form-control" style="width: 80px;" [value]="item.quantity" (change)="updateQty(item.product._id, $any($event.target).value)" min="1">
                    <button class="btn btn-outline-danger btn-sm" (click)="removeItem(item.product._id)">Remove</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        }
      </div>

      <div class="col-md-4">
        <div class="card shadow-sm border-0 p-4">
          <h4 class="fw-bold mb-3">Order Summary</h4>
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <span>{{ total }} EGP</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-4">
            <strong>Total</strong>
            <strong>{{ total }} EGP</strong>
          </div>
          <a routerLink="/checkout" class="btn btn-dark w-100 py-2 text-uppercase">Proceed to Checkout</a>
        </div>
      </div>
    </div>
  }
</div>
