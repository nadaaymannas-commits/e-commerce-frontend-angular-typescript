<div class="container mt-5 mb-5">
  <h2 class="text-center fw-bold text-uppercase mb-5">What Our Customers Say</h2>
  
  <div class="row g-4 justify-content-center">
    @for (t of testimonials; track t._id) {
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm border-0 p-3">
          <div class="card-body d-flex flex-column">
            <div class="mb-2 text-warning fs-5">
              @for (star of [1,2,3,4,5]; track $index) {
                <span [class.text-muted]="star > t.rating">★</span>
              }
            </div>
            <p class="flex-grow-1 fst-italic">"{{ t.comment }}"</p>
            <h6 class="fw-bold mb-0 mt-3">- {{ t.user?.name }}</h6>
            <small class="text-muted">Bought: {{ t.product?.name }}</small>
          </div>
        </div>
      </div>
    } @empty {
      <p class="text-center text-muted">No testimonials yet.</p>
    }
  </div>
</div>
