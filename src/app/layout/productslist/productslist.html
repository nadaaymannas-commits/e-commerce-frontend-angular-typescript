<div class="container mt-4">
  
  <div class="row mb-4">
    <div class="col-md-6 mx-auto">
      <div class="input-group">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Search for products..." 
          [(ngModel)]="searchQuery" 
          (keyup.enter)="onSearch()">
        <button class="btn btn-dark" type="button" (click)="onSearch()">Search</button>
      </div>
    </div>
  </div>

  <div class="row g-4 justify-content-center">
    @for (product of products; track product._id) {
      <div class="col-12 col-sm-6 col-lg-4"> 
        <app-product [myProduct]="product"></app-product>
      </div>
    } @empty {
      <div class="col-12 text-center mt-5">
        <p class="text-muted">No products found.</p>
      </div>
    }
  </div>

  @if (totalPages > 1) {
    <nav class="mt-5">
      <ul class="pagination justify-content-center">
        
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link text-dark" (click)="goToPage(currentPage - 1)">Previous</button>
        </li>
        
        @for (page of [].constructor(totalPages); track $index) {
          <li class="page-item" [class.active]="currentPage === $index + 1">
            <button 
              class="page-link" 
              [class.bg-dark]="currentPage === $index + 1"
              [class.text-white]="currentPage === $index + 1"
              (click)="goToPage($index + 1)">
              {{ $index + 1 }}
            </button>
          </li>
        }

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link text-dark" (click)="goToPage(currentPage + 1)">Next</button>
        </li>

      </ul>
    </nav>
  }

</div>
