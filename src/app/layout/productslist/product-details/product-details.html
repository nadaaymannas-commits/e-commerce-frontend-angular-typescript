@if (myProduct) {
  <div class="container mt-5 mb-5">
    
    <div class="row">
      <div class="col-md-6">
        <img [src]="staticURL + myProduct.imgURL" class="img-fluid rounded shadow-sm" alt="Product Image" style="width: 100%; max-height: 600px; object-fit: cover;">
      </div>
      
      <div class="col-md-6 d-flex flex-column justify-content-center mt-4 mt-md-0">
        <h1 class="fw-bold text-uppercase">{{ myProduct.name }}</h1>
        <p class="text-muted mt-3 fs-5">{{ myProduct.desc }}</p>
        
        <h3 class="mt-4 fw-bold">{{ myProduct.price }} EGP</h3>
        
        <div class="mt-3">
          <span class="badge bg-secondary p-2 me-2">Category: {{ myProduct.category?.name }}</span>
          <span class="badge bg-secondary p-2">Stock: {{ myProduct.stock }}</span>
        </div>
        
<button class="btn btn-dark mt-3 w-50 py-3 fw-bold text-uppercase" (click)="addToCart()">
  Add to Cart
</button>      </div>
    </div>

    @if (relatedProducts && relatedProducts.length > 0) {
      <div class="mt-5 pt-5 border-top">
        <h2 class="mb-4 text-uppercase fw-bold text-center">Related Products</h2>
        
        <div class="row g-4 justify-content-center">
          @for (product of relatedProducts; track product._id) {
            <div class="col-6 col-md-4 col-lg-3">
              <app-product [myProduct]="product"></app-product>
            </div>
          }
        </div>
      </div>
    }



  </div>
}
