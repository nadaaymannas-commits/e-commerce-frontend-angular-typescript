<header class="navbar">
  <div class="container navbar-inner">

    <a routerLink="/" class="brand">
      <span class="brand-text">MYSTORE</span>
    </a>

    <nav class="nav-links">
      <a routerLink="/home" routerLinkActive="active">Home</a>
      <a routerLink="/product-list" routerLinkActive="active">Products</a>
      <a routerLink="/testimonials" routerLinkActive="active">Testimonilas</a>


      @for (cat of categories; track cat._id) {
        <a [routerLink]="['/product-list']" [queryParams]="{ category: cat._id }" routerLinkActive="active">
          {{ cat.name }}
        </a>
      }
    </nav>

    <div class="nav-actions">

      <button class="icon-btn" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      @if (userName) {
        <div class="user-box">
          <button (click)="goToProfile()" class="icon-btn" aria-label="Profile">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
          <button class="logout-btn" (click)="logout()">Logout</button>
        </div>
      } @else {
        <a routerLink="/login" class="icon-btn" aria-label="Login">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
      }

      <a routerLink="/cart" class="icon-btn cart-btn" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge">{{ cartCount }}</span>
      </a>

    </div>
  </div>
</header>
