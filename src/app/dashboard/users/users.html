<div class="card shadow-sm border-0 mt-3">
  <div class="card-body">
    <h4 class="fw-bold mb-4">All Users</h4>
    
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          @for (user of users; track user._id) {
            <tr>
              <td>{{ user.name }}</td>
              <td>{{ user.email }}</td>
              <td>
                <span class="badge" [class.bg-danger]="user.role === 'admin'" [class.bg-secondary]="user.role !== 'admin'">
                  {{ user.role }}
                </span>
              </td>
              <td>
                <span class="badge" [class.bg-success]="user.isActive && !user.isDeleted" [class.bg-danger]="!user.isActive || user.isDeleted">
                  {{ user.isDeleted ? 'Deleted' : (user.isActive ? 'Active' : 'Inactive') }}
                </span>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center text-muted py-3">No users found.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
